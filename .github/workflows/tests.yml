name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Finds every tools/test_*.py, so new test files run with no edit here.
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      # Audit the real tester cards through the card gate.
      - run: python tools/cards.py tester --audit
